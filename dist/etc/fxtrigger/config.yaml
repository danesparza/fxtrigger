server:
  port: 3020
  allowed-origins: "*"
datastore:
  system: /var/lib/fxtrigger/db/system.db
  retentiondays: 30

# Local network discovery for fxcontroller.
discovery:
  enabled: true
  name: "" # Default: service-hostname-port; maximum 63 bytes
  id: "" # Set a unique stable ID to retain identity across hostname/port changes
